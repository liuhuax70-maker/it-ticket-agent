name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff 静态检查
        run: ruff check .
      # 格式不统一会产生大量无意义 diff，让 code review 失效，所以单独设门禁。
      # 本地跑 `make fmt` 修。
      - name: ruff 格式统一
        run: ruff format --check .


      # 类型检查：mypy 逐模块跑——每个服务都有自己的顶层 app 包，一次跑会报歧义
      - name: 类型检查
        run: python scripts/type_check.py

      # 语料一致性：规范值冲突、引用断链、重复句、占位符。
      # 放这里而不是评测 workflow：它**不依赖模型与知识库**，纯读文件，秒级，
      # 因此每次 PR 都能跑——而"同一事实在两篇文档里写了不同值"这类问题，
      # 恰恰是在改文档的 PR 里引入的。
      - name: 语料一致性检查
        run: python scripts/check_corpus_consistency.py

  test:
    name: 单元与集成测试（全部离线，不需要外部依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # 按服务分进程执行：每个服务都有顶层 app 包，同一会话内会互相覆盖
      - name: pytest（按服务分进程）
        run: python scripts/test_all.py

  manifests:
    name: K8s / Terraform 静态校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Helm 渲染
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          for svc in api-gateway query-orchestrator retrieval ingestion indexing model-gateway eval feedback authz; do
            helm template "$svc" infra/k8s/helm/rag-service \
              -f "infra/k8s/helm/values/$svc.yaml" \
              -f infra/k8s/overlays/dev/values.yaml > /dev/null
            echo "rendered: $svc"
          done

      - name: 校验 Kustomize
        run: |
          kubectl kustomize infra/k8s/base > /dev/null
          kubectl kustomize infra/k8s/overlays/dev > /dev/null

      - name: 校验 Terraform
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform fmt -check -recursive

      - name: 校验 docker compose
        run: docker compose -f docker-compose.yml config --quiet

  image:
    name: 构建服务镜像
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build（不推送，仅验证 Dockerfile 可构建）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          tags: rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max