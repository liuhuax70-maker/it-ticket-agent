name: eval-regression

# 为什么把评测单独放一个 workflow：
#   它需要**真实可用的模型与知识库**（有成本、有外网依赖），
#   因此不放在每次 PR 上跑，而是 nightly + 手工触发。
#   改动提示词、切分参数、检索权重后，手工触发一次即可得到回归对比。
on:
  schedule:
    - cron: "0 2 * * *" # 每天 02:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "评测样本数上限"
        required: false
        default: "20"

jobs:
  ragas:
    name: RAGAS 回归评测
    runs-on: ubuntu-latest
    # 需要预先在仓库 Secrets 里配置：
    #   RAG_GATEWAY_URL  —— 可达的 api-gateway 地址（如 https://rag-staging.example.com）
    #   RAG_EVAL_TOKEN   —— 调用 /chat 所需的访问令牌（开启鉴权时必需）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装评测依赖
        run: pip install -e ".[eval]"

      - name: 运行评测跑批
        env:
          # 评测跑批默认指向 localhost；CI 里通过 RAG_* 环境变量指向预发环境
          RAG_GATEWAY_URL: ${{ secrets.RAG_GATEWAY_URL }}
          RAG_EVAL_URL: ${{ secrets.RAG_EVAL_URL }}
          RAG_EVAL_TOKEN: ${{ secrets.RAG_EVAL_TOKEN }}
          EVAL_LIMIT: ${{ github.event.inputs.limit || '20' }}
        run: |
          if [ -z "$RAG_EVAL_URL" ]; then
            echo "未配置 RAG_EVAL_URL，跳过评测"
            exit 0
          fi
          python -m pipelines.eval_dag.run --limit "$EVAL_LIMIT"

      - name: L1 门禁（越权必须为 0）
        # 越权泄露是**绝对不变量**，不设阈值、不看波动：出现即失败。
        # hit@k 之类的指标先只打印，等基线稳定后再加"不许下降"的门禁。
        run: |
          python - <<'PY'
          import json, pathlib, sys

          path = pathlib.Path("eval_data/reports/baseline_latest.json")
          if not path.exists():
              print("没有找到报告文件，跳过门禁")
              sys.exit(0)

          summary = json.loads(path.read_text(encoding="utf-8"))["summary"]
          print("评测摘要:")
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          if summary.get("leak_count", 0) > 0:
              print(f"::error::检测到 {summary['leak_count']} 条越权泄露，评测不通过")
              sys.exit(1)
          if summary.get("count", 0) == 0:
              print("::error::零样本，评测没有真正执行")
              sys.exit(1)
          PY

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-report
          path: eval_data/reports/
          if-no-files-found: ignore
          retention-days: 30
