[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permission-aware-rag"
version = "0.1.0"
description = "企业级权限感知 RAG 知识库平台（FastAPI + LangGraph + Postgres + OpenSearch + Milvus + Redis + Kafka + LiteLLM）"
requires-python = ">=3.11"
dependencies = [
  # --- Web / 契约 ---
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  # --- 编排 ---
  "langgraph>=0.2.60",
  "langchain-core>=0.3",
  "langchain-text-splitters>=0.3",
  # --- 模型网关 ---
  "litellm>=1.50",
  # --- 存储 ---
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "pymilvus>=2.5.0,<3.0",
  "opensearch-py>=2.6",
  # --- 消息（占位，同步直连为默认） ---
  "aiokafka>=0.10",
  # --- 向量化 / 解析 ---
  "fastembed>=0.4",
  "pypdf>=4.2",
  # --- 安全（鉴权占位，JWT 校验待启用） ---
  "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]
# 评测服务需要（较重）。
# langchain-community 必须 <0.4：ragas 0.4.3 会 import
# `langchain_community.chat_models.vertexai`，该模块在 langchain-community 0.4 已被移除，
# 装成 0.4 会让 `import ragas` 直接 ModuleNotFoundError（上游 bug，暂无修复版本）。
eval = [
    "ragas>=0.4,<0.5",
    "datasets>=2.20",
    "langchain-openai>=0.2",
    "langchain-community>=0.3,<0.4",
]
# Langfuse trace 上报（未安装时 observability 自动降级为 no-op）
observability = ["langfuse>=2.50"]
# 备选本地向量化后端（体积大，默认用 fastembed）
local-embed = ["sentence-transformers>=3.0"]

[tool.setuptools]
# 只打包共享库；apps/ 与 services/ 以 --app-dir 方式运行，不做 site-packages 安装

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]
exclude = ["apps*", "services*", "pipelines*", "tests*", "migrations*", "data*", "configs*"]

[tool.pytest.ini_options]
# 仓库根可导入 packages.*；服务内 app.* 由各服务 tests 的 conftest 自行注入
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
# 逐模块跑（见 scripts/type_check.py）：每个服务都有顶层 app 包，一次跑会歧义。
python_version = "3.11"
files = ["packages", "services", "apps"]
ignore_missing_imports = true          # 第三方库没有存根时不报错（我们要查的是自己的类型关系）
warn_unused_configs = true
warn_redundant_casts = true            # 多余的 cast 说明类型已经推断对了，删掉
no_implicit_optional = false      # 现存大量 形参: X = None 的历史写法，一次性打开会产生上百条噪音；
warn_unused_ignores = true# 写了用不上的 type: ignore 会掩盖真实问题
check_untyped_defs = false          # 同上：等核心模块补齐注解后再收紧
disallow_untyped_defs = false          # 暂不强制所有函数写全注解（新代码建议写全）

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

