# Alembic 配置。
# 注意：数据库地址**不写在这里**，而是由 DATABASE_URL 环境变量提供
# （见 migrations/postgres/env.py），避免把连接串与口令提交进版本库。
[alembic]
script_location = migrations/postgres
prepend_sys_path = .
version_path_separator = os
# 迁移文件名带时间戳前缀，便于排序
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
