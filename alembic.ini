# Alembic configuration.
#
# NOTE: this file is read by alembic with the *locale* encoding on some platforms
# (configparser reads with encoding="locale"). Keeping it ASCII-only avoids
# UnicodeDecodeError on Windows (GBK) and other non-UTF8 locales.
# Chinese comments belong in migrations/postgres/*.py (read as UTF-8 by Python).
#
# The database URL is intentionally NOT stored here. It comes from the
# DATABASE_URL environment variable (see migrations/postgres/env.py) so that
# credentials never end up in version control.
[alembic]
script_location = migrations/postgres
prepend_sys_path = .
version_path_separator = os
# Timestamp-prefixed filenames so revisions sort naturally.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
