{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rag-service.serviceAccountName" . }}
  labels:
    {{- include "rag-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# 业务服务不需要访问 K8s API，因此不绑定任何 Role（最小权限）
automountServiceAccountToken: false
{{- end }}
