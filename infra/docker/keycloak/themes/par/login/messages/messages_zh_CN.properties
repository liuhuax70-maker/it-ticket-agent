# 登录页中文文案定制（覆盖内置 zh-CN 语言包）
#
# 只列需要改的键，其余继续用 Keycloak 内置翻译——
# 主题的 messages 会与父主题**合并**，本文件优先。
# 全部重写一遍的话，Keycloak 升级新增的键就会缺翻译（页面出现英文），
# 而且没人会注意到漏了哪个。
#
# 措辞参照 QQ 邮箱登录页：页面不带大标题，直接就是表单；
# 输入框用「账号」而不是「用户名 或 电子邮箱地址」。

# 页头主标题。QQ 邮箱没有这句，留空会让 <h1> 变成空元素（影响读屏），
# 所以给一句短问候而不是删掉它。
loginAccountTitle=欢迎回来

# 浏览器标签页标题。内置值是「登录到 {0}」，由 base 布局统一使用——
# 于是**注册页和找回密码页的标签也显示「登录到」**，与当前页面不符。
# 改为只显示品牌名，对所有页面都成立，也不会误导。
# {0} 是 realm 的 displayName。
loginTitle={0}

# 账号输入框
usernameOrEmail=账号
username=账号
email=电子邮箱

# 密码
password=密码
passwordShow=显示密码
passwordHide=隐藏密码

# 记住登录状态（QQ 邮箱的写法）
rememberMe=记住登录状态

# 按钮
doLogIn=登录
doRegister=注册新账号
doForgotPassword=忘记密码？
doSubmit=提交
doCancel=取消
doContinue=继续
doTryAgain=重试
doResend=重新发送

# 校验与错误提示（默认翻译生硬，改成人话）
invalidUserMessage=账号或密码不正确
invalidPasswordMessage=密码不正确
missingUsernameMessage=请输入账号
missingPasswordMessage=请输入密码
accountDisabledMessage=账号已被禁用，请联系管理员
accountTemporarilyDisabledMessage=账号被暂时锁定，请稍后再试或联系管理员
