# permission-aware-rag 登录主题
#
# 继承 keycloak.v2（PatternFly 5），只做视觉覆盖，不改模板与流程——
# 登录/注册/找回密码/OTP 这些页面共用这一套主题，
# 改模板容易漏掉某个页面，改样式则所有页面一起受益。
#
# 继承链：base -> keycloak -> keycloak.v2 -> par
#
# styles 里先列 parent 的 css/styles.css（本主题没有，Keycloak 会沿父链找到），
# 再列我们的覆盖文件。顺序很重要：覆盖必须排在后面才能生效。
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/par.css
