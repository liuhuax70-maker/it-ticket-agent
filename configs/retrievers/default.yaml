# 检索调参（由 services/retrieval 在启动时加载，优先级高于 .env）
#
# 为什么单独放文件而不是全塞 .env：检索参数是**需要反复试的**（召回条数、RRF 权重、
# 重排开关），放在版本库里可以被 review，也能按环境/域拆多份文件；
# .env 更适合放「连接信息」这类不常变的东西。
#
# 键名必须与 services/retrieval/app/config.py::TUNABLE_KEYS 一致（白名单外的键会被忽略并告警）。
# 修改后需重启 retrieval 服务生效（启动时读取一次）。
#
# 支持的键：
#   retrieve_mode / top_k / vector_top_k / bm25_top_k / rrf_k /
#   rrf_weight_vector / rrf_weight_bm25 / min_score / rerank_enabled / rerank_model

retrieval:
  # vector | keyword | hybrid
  retrieve_mode: hybrid

  # 最终返回条数
  top_k: 5

  # 各路召回条数：先多召回，再由重排/截断收敛到 top_k
  vector_top_k: 20
  bm25_top_k: 20

  # RRF 平滑常数（经验值 60，越小越偏向头部结果）
  rrf_k: 60

  # 各路权重：BM25 在精确术语/编号上更稳，向量在语义改写上更强。
  # 调权重前请先有 eval 结果，否则只是凭感觉挪动。
  rrf_weight_vector: 1.0
  rrf_weight_bm25: 1.0

  # 相关性阈值（余弦相似度）。0.43 是实测标定值：
  # 无关提问 0.3077~0.4077 / 真实制度提问 0.4521~0.7785，中间是干净空档。
  # 不设阈值时「你好」也会召回制度切片，界面会列出与提问无关的资料。
  # ⚠️ 换语料或换嵌入模型后必须重新标定（ADR 0008），不要直接沿用。
  # 只对向量路真正有效：BM25 分数量纲是 5~9，永远不会低于这个值；
  # 混合模式的相关性判定以向量路为准（见 app/hybrid.py 的闸门注释）。
  min_score: 0.43

  # 重排默认关闭——依据是两轮实测，不是保守。
  # 第一轮（41 条，指标贴顶 100%）：质量无变化，P50/P95 +34%/36%。当时无法排除
  # 「评测集太简单、重排有增益但体现不出来」，于是按计划先做难评测集再复测。
  # 第二轮（70 条，片段召回 98%、NDCG 0.9864，已余量）：cross-encoder 真实开启
  # （health 可见 cross-encoder:BAAI/bge-reranker-base，单次 20 hit 约 1.6s），
  # hit@k / MRR / NDCG / 片段召回**分毫不差**（multi-hop 缺的那个分块也没被救回），
  # 而 P50/P95 852/1070ms -> 10782/22214ms（**12.7x / 20.8x**，CPU 推理）。
  # 结论：这套 CPU 部署下重排是纯延迟开销、零质量收益。要翻案需要：
  # a) 更强的 reranker 或 GPU；b) 评测集上出现「RRF 排错、重排能纠」的具体案例。
  rerank_enabled: false
  rerank_model: BAAI/bge-reranker-base
