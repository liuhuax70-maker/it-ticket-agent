# 关键规范值：同一事实被写在多处时，取值必须一致。
#
# 为什么需要它：实测中"核心工作时间"在两篇文档里取过不同的值（9:30-18:30 与 10:00-16:00），
# 而**用户拿到哪个答案取决于检索命中了哪一篇**。这类缺陷 ACL 兜不住、提示词也兜不住，
# 只能靠数据治理发现——而"靠人工通读发现自己写的东西前后矛盾"是不现实的。
#
# 每条声明一个**提取规则**（正则，必须有且只有一个捕获组）。检查逻辑：
#   * 该规则在全语料里提取出的**不同取值必须只有一种**；
#   * 该规则若一处都匹配不到，检查**失败**——静默失效的一致性检查比没有检查更糟，
#     它会让人以为"查过了没问题"，而实际是规则过期了（措辞改了、文档删了）。
#
# 唯一匹配不到的fail 规则会让 CI 红，这正是想要的：改措辞的人必须同步改规则。
#
# pattern 用单引号包裹（YAML 单引号内反斜杠是字面量），避免转义歧义。

facts:
  - key: 核心工作时间
    pattern: '核心工作时间为([^，。；\n]+)'
    note: 考勤制度与员工手册都写过；曾出现两处取值冲突，是本检查的由来

  - key: 标准工时
    pattern: '标准工时为([^，。；\n]+)'
    note: 与核心工作时间同段出现，容易被一起改漏

  - key: 年假天数（司龄一至三年）
    pattern: '司龄一至三年者每年([一二三四五六七八九十]+天)'
    note: 年假标准只在员工手册定义，考勤制度引用它——引用关系由 references 检查保障

  - key: 年假天数（司龄三至五年）
    pattern: '三至五年者每年([一二三四五六七八九十]+天)'

  - key: 年假天数（五年以上）
    pattern: '五年以上者每年([一二三四五六七八九十]+天)'

  - key: 年度调薪窗口
    pattern: '调薪窗口[^，。；\n]{0,12}?每年([一二三四五六七八九十]+月)'
    note: 薪酬制度与 HR 内部制度都写了调薪窗口

  - key: 病假证明要求（连续超过三天）
    pattern: '连续病假超过三[天日]的[，,]?须提供([^，。；\n]+?)(?:开具)?的?证明'
    note: 曾与员工手册的"二级以上医院"冲突，已按"专门文档负责细节"整改

  - key: 入职体检报销上限
    pattern: '报销上限为([^，。；\n]+)'
    note: 金额类规范值；费用报销制度引用员工手册，不重复写数字

  - key: 入职培训完成时限
    pattern: '在([^，。；\n]+?)内完成入职培训课程'

  - key: 加班调休有效期
    pattern: '加班调休的有效期为([^，。；\n]+)'

  - key: 外部培训审批门槛
    pattern: '外部培训费用在([^，。；\n]+?)以下的'

  - key: 培训服务期
    pattern: '培训结束后应在公司服务满([^，。；\n]+)'

  - key: 报销提交时限
    pattern: '费用发生之日起([^，。；\n]+?)内提交'
    note: 这是最常见的"制度类问题"之一，被引用得最多

  - key: 单笔财务负责人审批门槛
    pattern: '单笔在([^，。；\n]+?)以上的[，,]?须由财务负责人审批'
    note: 提取规则必须锚定**后果**（谁审批），否则会把"五万元以上须总经理办公会审议"也抓进来
      ——那不是冲突，是两个不同层级。规则写宽的代价是假阳性，假阳性会让人不再信这个检查

  - key: 单笔总经理办公会审议门槛
    # 中间允许逗号：原文是"单笔在五万元（含）以上的，须提交总经理办公会审议"
    pattern: '单笔在([^。；\n]+?)以上的[^。；\n]{0,6}?须提交总经理办公会审议'

  - key: 数据删除响应时限
    pattern: '应在([^，。；\n]+?)内完成响应与处理'

  - key: 生产环境发布窗口
    pattern: '生产环境发布统一在([^，。；\n]+?)进行'

  - key: 绩效等级档位
    pattern: '绩效分为([^，。；\n]+?)五档'
