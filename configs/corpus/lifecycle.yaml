# 语料生命周期声明（失效管理）。
#
# 为什么是声明文件而不是"调接口改状态"：语料生命周期跟语料本身一样是**配置**，
# 放进版本库才能被 review、才能被一致性检查发现"这份文档的失效日期已经过了"。
# 只有声明式才能同时满足"可见"与"可治理"。
#
# 匹配规则：按**文件名**匹配（上传入库的文件其 source 会被改写成 data/uploads/<原名>，
# 按完整路径匹配必然对不上）。同名文件会共享声明——语料里刻意没有同名文件。
#
# 字段：
#   status          retired = 已废止（不参与检索）；active = 现行有效（默认）
#   effective_from  生效日期（未到该日期视为未生效，不参与检索）
#   effective_to    失效日期（过了该日期视为已失效，不参与检索）
#   superseded_by   被哪份文档取代（仅作记录，供台账与人工查看）
#   note            原因说明
#
# ⚠️ 日期判定发生在**入库时**：文档不会在失效当天自动翻转状态，
#    需要重新入库（或由一致性检查提醒后处理）。这是刻意的取舍——
#    检索侧只做静态字段过滤，不引入"按当前时间计算"的动态条件。
#    一致性检查会在 CI 里对"已过失效日期"的声明告警，作为兜底。

documents:
  travel_allowance_2024.md:
    status: retired
    effective_to: "2025-12-31"
    superseded_by: 差旅管理制度
    note: 2024 版差旅费标准，自 2026 年起由《差旅管理制度》取代
