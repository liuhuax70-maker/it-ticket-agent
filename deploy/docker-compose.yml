# 本地依赖服务编排：Milvus standalone(etcd + MinIO) + Redis。
#
# 这是开发环境工具，不是交付物：
#   - Elasticsearch 到 P2 接入混合检索时再加进来
#   - 生产编排（K8s / Helm / 镜像）不属于本项目范围
#
# 用法：docker compose -f deploy/docker-compose.yml up -d
name: permission-aware-rag

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: pa-rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      start_period: 10s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: pa-rag-minio
    environment:
      # 新旧两套变量名都写上，兼容不同 MinIO 版本
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    # 仅集群内部使用，默认不对外暴露端口；需调试控制台时再解开 9001 映射
    # ports:
    #   - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      start_period: 10s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: pa-rag-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      # 宿主机端口走 .env 覆盖，避免与本机已有的 Milvus 实例冲突：
      #   docker compose -f deploy/docker-compose.yml --env-file .env up -d
      - "${MILVUS_PORT:-19530}:19530"            # gRPC / SDK 入口
      - "${MILVUS_METRICS_PORT:-9091}:9091"      # 健康检查 / 指标
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      # 等依赖真正就绪再启动，否则 milvus 会反复重启（见开发流程文档 §11 坑位 #10）
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: pa-rag-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
