# 用法：docker compose -f deploy/docker-compose.yml up -d --build
# 说明：构建上下文为项目根目录（..），.env 位于项目根目录
#
# 版本对齐：本机 pymilvus 为 3.0.2，故 Milvus 服务端固定 v3.0.2；
# etcd/minio 版本参照官方 v3.0.2 standalone compose。

name: it-ticket-assistant

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      # 容器内网络：使用服务名，覆盖 .env 中的本地地址
      MILVUS_HOST: milvus
      OLLAMA_BASE_URL: http://ollama:11434
      # 容器内固定路径（覆盖 .env 中的本地路径）
      CHECKPOINTER_PATH: /data/checkpoints.sqlite
    ports:
      - "8000:8000"
    depends_on:
      milvus:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - checkpoint_data:/data
    restart: unless-stopped

  # ---- 依赖：Milvus 元数据 ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://0.0.0.0:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped

  # ---- 依赖：Milvus 对象存储 ----
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # ---- 向量库（稠密 + 内置 BM25） ----
  milvus:
    image: milvusdb/milvus:v3.0.2
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      # 9091 为 Milvus 指标/健康端口：Windows 保留端口段 9034-9133 已占用它，
      # 且该端口只需容器内访问（healthcheck 走 localhost:9091），故不映射到宿主机。
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

  # ---- 本地生成模型 ----
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # 有 NVIDIA GPU 时取消注释：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: ["gpu"]
    restart: unless-stopped

volumes:
  checkpoint_data:
  milvus_data:
  etcd_data:
  minio_data:
  ollama_data:
